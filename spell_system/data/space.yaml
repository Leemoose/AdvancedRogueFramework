# Space School Spells
# Spells focused on teleportation and movement manipulation

spells:
  blink:
    name: "Blink"
    school: space
    level: 1
    description: |
      Instantly teleport a short distance in any direction.

      Great for escaping danger or closing gaps quickly.
    cost: 3
    cooldown: 5
    range: 5
    action_cost: 25
    targeting: ground
    icon: 9110
    required_intelligence: 0
    tags: [space, movement, utility]
    effects:
      - type: custom
        handler: blink_direction
        distance: 5

  teleport:
    name: "Teleport"
    school: space
    level: 2
    description: |
      Teleport yourself to a random location on the current floor.

      Useful for escaping dangerous situations, but the
      destination is unpredictable.
    cost: 8
    cooldown: 20
    range: 0
    action_cost: 50
    targeting: self
    icon: 9111
    required_intelligence: 5
    tags: [space, movement, escape]
    effects:
      - type: custom
        handler: teleport_random
        target: self

  teleport_other:
    name: "Banish"
    school: space
    level: 3
    description: |
      Teleport an enemy to a random location.

      Useful for removing a dangerous foe from combat
      or separating enemies.
    cost: 12
    cooldown: 25
    range: 6
    action_cost: 75
    targeting: enemy
    icon: 9112
    required_intelligence: 10
    tags: [space, control, utility]
    effects:
      - type: custom
        handler: teleport_random
        target: other
      - type: message
        message: "{target} is banished to a distant location!"

  swap:
    name: "Dimensional Swap"
    school: space
    level: 4
    description: |
      Swap positions with any visible creature.

      Can be used offensively to reposition enemies
      or defensively to escape.
    cost: 10
    cooldown: 15
    range: 8
    action_cost: 50
    targeting: enemy
    icon: 9113
    required_intelligence: 12
    tags: [space, movement, tactical]
    effects:
      - type: custom
        handler: swap_positions

  blink_strike:
    name: "Blink Strike"
    school: space
    level: 2
    description: |
      Teleport directly to a target and strike them.

      Combines dimensional magic with a devastating melee
      attack in one swift motion.
    cost: 5
    cooldown: 8
    range: 5
    action_cost: 75
    targeting: enemy
    icon: 9114
    required_intelligence: 5
    tags: [space, movement, damage]
    effects:
      - type: custom
        handler: blink_to_target
      - type: damage
        amount: 15
        damage_type: physical
        scales_with_intelligence: false
