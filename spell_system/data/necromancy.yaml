# Necromancy School Spells
# Spells focused on life drain, poison, and dark magic

spells:
  sap_vitality:
    name: "Sap Vitality"
    school: necromancy
    level: 1
    description: |
      Drain the life force from a target.

      Deals damage to the target and heals the caster for
      the same amount.
    cost: 5
    cooldown: 5
    range: 5
    action_cost: 50
    targeting: enemy
    icon: 9102
    required_intelligence: 0
    tags: [necromancy, damage, heal, lifesteal]
    effects:
      - type: lifesteal
        amount: 3
        scales_with_intelligence: true

  poison_touch:
    name: "Poison Touch"
    school: necromancy
    level: 2
    description: |
      Infect a target with deadly poison.

      The poison deals damage over time and can stack
      with itself.
    cost: 4
    cooldown: 8
    range: 4
    action_cost: 50
    targeting: enemy
    icon: 9106
    required_intelligence: 3
    tags: [necromancy, dot, poison]
    effects:
      - type: apply_status
        status: poison
        duration: 5
        damage: 4
        scales_with_intelligence: true

  life_tap:
    name: "Life Tap"
    school: necromancy
    level: 2
    description: |
      Sacrifice health to restore mana.

      Converts a portion of your health into magical energy.
      Use with caution.
    cost: 0
    cooldown: 10
    range: 0
    action_cost: 25
    targeting: self
    icon: 9107
    required_intelligence: 5
    tags: [necromancy, utility, self-damage]
    effects:
      - type: damage
        amount: 10
        target: self
      - type: custom
        handler: restore_mana
        amount: 15

  dark_pact:
    name: "Dark Pact"
    school: necromancy
    level: 3
    description: |
      Enter a berserk state, gaining immense power at a cost.

      Greatly increases combat stats but prevents spellcasting
      and applies a penalty when the effect ends.
    cost: 10
    cooldown: 30
    range: 0
    action_cost: 50
    targeting: self
    icon: 9108
    required_intelligence: 10
    tags: [necromancy, buff, risky]
    effects:
      - type: self_buff
        status: berserk
        duration: 8
